services:

  postgres:
    image: postgres:16
    container_name: airflow_training_postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}

    ports:
      - "5432:${POSTGRES_PORT}"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  nifi:
    image: apache/nifi:2.11.0 
    container_name: training_nifi

    ports:
      - "8443:8443"
      - "8085:8085"

    environment:
      SINGLE_USER_CREDENTIALS_USERNAME: ${NIFI_USERNAME}
      SINGLE_USER_CREDENTIALS_PASSWORD: ${NIFI_PASSWORD}

    volumes:
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_state:/opt/nifi/nifi-current/state
      - nifi_database:/opt/nifi/nifi-current/database_repository
      - nifi_flowfile:/opt/nifi/nifi-current/flowfile_repository
      - nifi_content:/opt/nifi/nifi-current/content_repository
      - nifi_provenance:/opt/nifi/nifi-current/provenance_repository
      - ./nifi/extensions:/opt/nifi/nifi-current/nar_extensions

      - ./data/generated:/data/input:ro
      - ./hadoop/config:/opt/nifi/hadoop-config:ro
      - ./nifi/drivers:/opt/nifi/drivers

  kafka:
    image: apache/kafka:4.1.1
    container_name: training_kafka

    ports:
      - "9092:9092"



      - "29092:29092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  
  namenode:
    image: apache/hadoop:3.5.0
    container_name: training_namenode
    hostname: namenode
    restart: unless-stopped
    user: root

    environment:
      HDFS_NAMENODE_USER: "root"
      HDFS_DATANODE_USER: "root"
      HDFS_SECONDARYNAMENODE_USER: "root"
      YARN_RESOURCEMANAGER_USER: "root"
      YARN_NODEMANAGER_USER: "root"
      ENSURE_NAMENODE_DIR: "/opt/hadoop/data/name"

    command:
      - bash
      - -c
      - |
        if [ ! -f /opt/hadoop/data/name/current/VERSION ]; then
          echo "Formatting NameNode..."
          hdfs namenode -format -force -nonInteractive
        fi
        exec hdfs namenode

    ports:
      - "9870:9870"
      - "8020:8020"

    volumes:
      - namenode_data:/opt/hadoop/data
      - ./hadoop/config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
  
  datanode1:
    image: apache/hadoop:3.5.0
    container_name: training_datanode1
    hostname: datanode1
    restart: unless-stopped
    user: root

    environment:
      HDFS_NAMENODE_USER: "root"
      HDFS_DATANODE_USER: "root"
      HDFS_SECONDARYNAMENODE_USER: "root"
      YARN_RESOURCEMANAGER_USER: "root"
      YARN_NODEMANAGER_USER: "root"

    command:
      - hdfs
      - datanode

    volumes:
      - datanode1_data:/opt/hadoop/data
      - ./hadoop/config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro

    depends_on:
      - namenode
  
  datanode2:
    image: apache/hadoop:3.5.0
    container_name: training_datanode2
    hostname: datanode2
    restart: unless-stopped
    user: root
    
    environment:
      HDFS_NAMENODE_USER: "root"
      HDFS_DATANODE_USER: "root"
      HDFS_SECONDARYNAMENODE_USER: "root"
      YARN_RESOURCEMANAGER_USER: "root"
      YARN_NODEMANAGER_USER: "root"

    command:
      - hdfs
      - datanode

    volumes:
      - datanode2_data:/opt/hadoop/data
      - ./hadoop/config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro

    depends_on:
      - namenode
  
  spark-master:
    image: apache/spark:4.2.0-python3
    container_name: training_spark_master
    hostname: spark-master
    restart: unless-stopped

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master

    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
      HADOOP_CONF_DIR: /opt/spark/conf/hadoop
      SPARK_HOME: /opt/spark
      SPARK_LOCAL_DIRS: /tmp/spark-local
      SPARK_CONF_DIR: /opt/spark/conf
      PATH: /opt/spark/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_HOST: postgres  

    ports:
      - "18080:8080"
      - "7077:7077"
      - "4040:4040"

    volumes:
      - ./hadoop/config:/opt/spark/conf/hadoop:ro
      - ./spark/jobs:/opt/spark/jobs
      - ./spark/data:/opt/spark/data
      - ./spark/jars/postgresql-42.7.8.jar:/opt/spark/jars/postgresql-42.7.8.jar:ro
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro

  spark-worker1:
    image: apache/spark:4.2.0-python3
    container_name: training_spark_worker1
    hostname: spark-worker1
    restart: unless-stopped

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077

    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 1g
      HADOOP_CONF_DIR: /opt/spark/conf/hadoop
      SPARK_LOCAL_DIRS: /tmp/spark-local
      SPARK_CONF_DIR: /opt/spark/conf
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_HOST: postgres

    depends_on:
      - spark-master

    ports:
      - "18081:8081"

    volumes:
      - ./hadoop/config:/opt/spark/conf/hadoop:ro
      - ./spark/jobs:/opt/spark/jobs
      - ./spark/data:/opt/spark/data
      - ./spark/jars/postgresql-42.7.8.jar:/opt/spark/jars/postgresql-42.7.8.jar:ro
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro

  spark-worker2:
    image: apache/spark:4.2.0-python3
    container_name: training_spark_worker2
    hostname: spark-worker2
    restart: unless-stopped

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077

    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 1g
      HADOOP_CONF_DIR: /opt/spark/conf/hadoop
      SPARK_LOCAL_DIRS: /tmp/spark-local
      SPARK_CONF_DIR: /opt/spark/conf
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_HOST: postgres  

    depends_on:
      - spark-master

    ports:
      - "18082:8081"

    volumes:
      - ./hadoop/config:/opt/spark/conf/hadoop:ro
      - ./spark/jobs:/opt/spark/jobs
      - ./spark/data:/opt/spark/data
      - ./spark/jars/postgresql-42.7.8.jar:/opt/spark/jars/postgresql-42.7.8.jar:ro
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
  
  api:
    build:
      context: ./api
    container_name: training_api
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_HOST: postgres      # see below
      NIFI_URL: http://nifi:8085/api/transactions 
    depends_on:
      - postgres
      - nifi
    volumes:
      - ./api:/app                  # live-reload during dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
  
  metabase:
    image: metabase/metabase:v0.54.1
    container_name: training_metabase
    hostname: metabase
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase_app
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      MB_DB_HOST: postgres
      # Clé de chiffrement des credentials stockés (génère-la une fois et garde-la)
      MB_ENCRYPTION_SECRET_KEY: ${MB_ENCRYPTION_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail -I http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  postgres_data:
  nifi_conf:
  nifi_state:
  nifi_database:
  nifi_flowfile:
  nifi_content:
  nifi_provenance:
  namenode_data:
  datanode1_data:
  datanode2_data:
